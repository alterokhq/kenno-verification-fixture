name: Verification fixture
on: [pull_request]
permissions:
  contents: read
jobs:
  required-ci:
    name: required-ci
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: test "$(cat result.txt)" = pass
  optional-ci:
    name: optional-ci
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: exit 1
